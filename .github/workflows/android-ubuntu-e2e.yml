name: Android Ubuntu E2E

# Real end-to-end test of the Ubuntu installation flow (spec: android-ubuntu-e2e):
# builds the debug APK, boots an x86_64 emulator, drives the app's own install
# pipeline (download → SHA-256 → staged extract → apt → READY), executes
# commands INSIDE the resulting rootfs via the app's own proot, exercises
# lifecycle interference mid-install, verifies persistence across force-stop,
# and auto-fixes + rebuilds + retests when it fails (bounded repair loop).
# A green run means Ubuntu is genuinely usable — never just a UI label.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Emulator API level'
        required: false
        default: '30'
      max-repair-attempts:
        description: 'Auto-fix + rebuild + rerun cycles (0 = test only)'
        required: false
        default: '2'
      e2e-timeout:
        description: 'Per-attempt E2E timeout in seconds'
        required: false
        default: '2700'
      clean:
        description: 'Uninstall the app first (fresh install state)'
        required: false
        default: 'true'
  workflow_call:
    inputs:
      api-level:
        required: false
        default: '30'
        type: string
      max-repair-attempts:
        required: false
        default: '2'
        type: string
      e2e-timeout:
        required: false
        default: '2700'
        type: string
      clean:
        required: false
        default: 'true'
        type: string

concurrency:
  group: android-ubuntu-e2e-${{ github.event.inputs.api-level || '30' }}
  cancel-in-progress: false

jobs:
  ubuntu-e2e:
    name: Real Ubuntu install → usable → persistent (API ${{ github.event.inputs.api-level || '30' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the built APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -n "$(ls app/build/outputs/apk/debug/OpenChat-x86_64-debug.apk 2>/dev/null)" || {
            echo "x86_64 debug APK missing"; exit 1; }

      - name: Real Ubuntu E2E on emulator (install → verify → interfere → persist)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '30' }}
          target: google_apis
          arch: x86_64
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            MAX=${{ github.event.inputs.max-repair-attempts || '2' }}
            CLEAN=""
            if [ "${{ github.event.inputs.clean || 'true' }}" = "true" ]; then CLEAN="--clean"; fi
            attempt=0
            ok=0
            while [ "$attempt" -le "$MAX" ]; do
              echo "== E2E attempt $attempt of $MAX =="
              if bash scripts/e2e-ubuntu.sh --ci $CLEAN \
                   --apk 'app/build/outputs/apk/debug/OpenChat-x86_64-debug.apk' \
                   --timeout '${{ github.event.inputs.e2e-timeout || '2700' }}' \
                   --collect-diagnostics; then
                ok=1
                echo "== E2E PASSED on attempt $attempt =="
                break
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -gt "$MAX" ]; then
                echo "== E2E still failing after $MAX repair cycles — honest stop =="
                break
              fi
              echo "== E2E attempt $((attempt-1)) failed — bounded auto-fix =="
              # Deterministic repair first (root-cause patterns from the run log),
              # then an AI-assisted patch pass for the remaining classes of bug.
              python3 scripts/autofix.py e2e-artifacts/logs/e2e-run.log || true
              python3 scripts/autofix_ai.py e2e-artifacts/logs/e2e-run.log || true
              # Rebuild after any repair; a repair that did not change the tree
              # still gets a genuine retest (flaky-device isolation).
              ./gradlew assembleDebug --no-daemon --stacktrace
            done
            if [ "$ok" != "1" ]; then
              echo "FINAL RESULT: FAIL — see e2e-artifacts/summary.txt and failure-report.md"
              exit 1
            fi

      - name: Upload E2E artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-e2e-api${{ github.event.inputs.api-level || '30' }}
          path: |
            e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Release gate
        if: always()
        run: |
          if [ -f e2e-artifacts/summary.txt ] && grep -q "FINAL RESULT: PASS" e2e-artifacts/summary.txt; then
            echo "Ubuntu E2E gate: PASS — Ubuntu is genuinely usable on the emulator."
          else
            echo "Ubuntu E2E gate: FAIL"
            [ -f e2e-artifacts/failure-report.md ] && cat e2e-artifacts/failure-report.md || true
            exit 1
          fi
