name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build (ABI splits) + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch llama.cpp (pinned b10941) for on-device GGUF engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b10941
          path: app/src/main/cpp/llama.cpp
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APKs (per-ABI) + unit tests
        run: ./gradlew --no-daemon --parallel --build-cache assembleDebug testDebugUnitTest --stacktrace

      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenChat-debug-APKs
          path: app/build/outputs/apk/debug/OpenChat-*.apk
          if-no-files-found: error
