name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build (ABI splits) + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch llama.cpp (pinned b10941) for on-device GGUF engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b10941
          path: app/src/main/cpp/llama.cpp
          fetch-depth: 1

      - name: Install CMake 3.31 + Vulkan SDK (glslc) for the GGUF Vulkan backend
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.1" >/dev/null 2>&1 || true
          wget -qO /tmp/lunarg-key.asc "https://packages.lunarg.com/lunarg-signing-key-pub.asc"
          test -s /tmp/lunarg-key.asc
          sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/lunarg-vulkan.gpg /tmp/lunarg-key.asc
          echo "deb [signed-by=/usr/share/keyrings/lunarg-vulkan.gpg] https://packages.lunarg.com/vulkan noble main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk
          glslc --version | head -1
          # ggml-vulkan needs the SPIRV-Headers CMake config package. Host
          # prefixes are invisible to the NDK cross-configure (root-path
          # filtering), so provide a pinned Khronos install explicitly.
          git clone --depth 1 --branch sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers-src
          cmake -S /tmp/spirv-headers-src -B /tmp/spirv-headers-build -DCMAKE_INSTALL_PREFIX=/tmp/spirv-headers-install >/dev/null
          cmake --install /tmp/spirv-headers-build >/dev/null
          echo "SPIRV_HEADERS_DIR=/tmp/spirv-headers-install/lib/cmake/SPIRV-Headers" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APKs (per-ABI) + unit tests
        run: ./gradlew --no-daemon --parallel --build-cache assembleDebug testDebugUnitTest --stacktrace

      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenChat-debug-APKs
          path: app/build/outputs/apk/debug/OpenChat-*.apk
          if-no-files-found: error
