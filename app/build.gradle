plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ---------------------------------------------------------------------------
// Release signing (spec §19–§20)
// Credentials come ONLY from environment variables or keystore.properties.
// Never hard-coded, never committed. See docs/RELEASE_SIGNING.md
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def cred = { String key ->
    System.getenv(key) ?: keystoreProps.getProperty(key) ?: null
}
def ksPath = cred('ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = ksPath != null && new File(ksPath).exists()

android {
    namespace 'com.openchat.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.openchat.android'
        minSdk 29
        // targetSdk 28 is INTENTIONAL: Android 10+ enforces W^X for apps targeting
        // >= 29 and blocks exec() of binaries in app data. Targeting 28 keeps the
        // SELinux untrusted_app legacy policy so the Ubuntu userspace (proot/bash)
        // can execute downloaded rootfs binaries — same approach as Termux.
        targetSdk 28
        versionCode 8
        versionName '0.1.7'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                // ggml-vulkan needs the host SPIRV-Headers cmake config; the
                // NDK cross-configure cannot see host prefixes, so CI exports
                // SPIRV_HEADERS_DIR (pinned Khronos install) and we forward it.
                // Without the env var (plain local builds) the Vulkan backend
                // stays off — see CMakeLists.txt glslc guard.
                def spDir = System.getenv('SPIRV_HEADERS_DIR')
                if (spDir != null && !spDir.isEmpty()) {
                    arguments "-DSPIRV-Headers_DIR=${spDir}"
                }
                def vkInc = System.getenv('OPENCHAT_VK_INCLUDE')
                if (vkInc != null && !vkInc.isEmpty()) {
                    arguments "-DOPENCHAT_VK_INCLUDE=${vkInc}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            // 3.31: FindVulkan resolves the NDK's libvulkan + host glslc (Vulkan
            // backend for on-device GGUF, arm64-v8a/x86_64).
            version '3.31.1'
        }
    }

    // -----------------------------------------------------------------------
    // Per-ABI split builds (spec §2, §18, §21):
    //   release/OpenChat-arm64-v8a.apk
    //   release/OpenChat-armeabi-v7a.apk
    //   release/OpenChat-x86_64.apk
    // -----------------------------------------------------------------------
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = variant.buildType.name == 'release'
                        ? "OpenChat-${abi}.apk"
                        : "OpenChat-${abi}-debug.apk"
            }
        }
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiCodes = ['armeabi-v7a': 2, 'arm64-v8a': 3, 'x86_64': 1]
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiCodes[abi]
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword cred('ANDROID_KEYSTORE_PASSWORD')
                keyAlias cred('ANDROID_KEY_ALIAS')
                keyPassword cred('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Honest fallback: signed with debug key so the APK still installs.
                // CI prints an explicit warning when this path is taken (spec §32).
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES', '/META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-text'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.navigation:navigation-compose:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests — android.jar's stub returns nulls (breaks JSON round trips)
    testImplementation 'org.json:json:20240303'
}
